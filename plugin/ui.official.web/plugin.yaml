{
  "manifest_version": "0.1.0-alpha.1",
  "id": "ui.official.web",
  "version": "0.1.0-alpha.1",
  "kind": "interface",
  "runtime": {
    "type": "process",
    "command": "server/plugin.py",
    "args": []
  },
  "provides": [
    {
      "capability": "ui.session.status",
      "operation": "query",
      "input_schema": "schemas/session-status-input.json",
      "output_schema": "schemas/session-status-output.json"
    }
  ],
  "consumes": [
    "system.audit.inspect",
    "system.audit.list",
    "system.audit.retention.enforce",
    "system.capabilities.call",
    "system.capabilities.describe",
    "system.capabilities.list",
    "system.config.get",
    "system.config.history",
    "system.config.rollback",
    "system.config.schema",
    "system.config.set",
    "system.grants.create",
    "system.grants.inspect",
    "system.grants.list",
    "system.grants.revoke",
    "system.identity.credential.rotate",
    "system.identity.get",
    "system.init",
    "system.invocations.cancel",
    "system.plugins.disable",
    "system.plugins.enable",
    "system.plugins.inspect",
    "system.plugins.list",
    "system.plugins.register",
    "system.plugins.remove",
    "system.plugins.rollback",
    "system.plugins.start",
    "system.plugins.status",
    "system.plugins.stop",
    "system.plugins.trust.set",
    "system.plugins.validate",
    "system.plugins.versions",
    "system.reconciliation.inspect",
    "system.reconciliation.list",
    "system.reconciliation.resolve",
    "system.resources.cache.cleanup",
    "system.resources.status",
    "system.secrets.list",
    "system.secrets.register",
    "system.secrets.revoke",
    "system.status.get",
    "system.version.get"
  ],
  "permissions": {
    "network": ["loopback-bind:127.0.0.1"],
    "filesystem": {
      "read": ["plugin-package://ui.official.web/web"],
      "write": ["plugin-data://ui.official.web"]
    },
    "workspaces": [],
    "secrets": []
  },
  "resources": {
    "max_concurrency": 4,
    "timeout_seconds": 5,
    "disk_min_free_mb": 32
  },
  "config_schema": "schemas/config.json"
}
